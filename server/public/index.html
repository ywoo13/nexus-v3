<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Server</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #14131f;
        --surface: rgba(30, 28, 46, 0.72);
        --coral: #ff7a59;
        --mint: #6bcfa6;
        --text: #f5f3ef;
        --text-dim: #b8b4c8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: radial-gradient(circle at 50% 20%, #241f38 0%, #14131f 70%);
        color: var(--text);
        font-family: "Inter", sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        width: 460px;
        max-width: 100%;
        background: var(--surface);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
      }

      h1 {
        font-family: "Poppins", sans-serif;
        font-size: 34px;
        margin: 0 0 4px;
        background: linear-gradient(90deg, var(--coral), var(--mint));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        color: var(--text-dim);
        font-size: 14px;
        margin: 0 0 28px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px;
        border-radius: 999px;
        background: rgba(107, 207, 166, 0.15);
        color: var(--mint);
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 24px;
      }

      .status-pill.offline {
        background: rgba(255, 122, 89, 0.15);
        color: var(--coral);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
      }

      .stat-box {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 16px 10px;
      }

      .stat-value {
        font-family: "Poppins", sans-serif;
        font-size: 26px;
        font-weight: 700;
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 4px;
      }

      .endpoint {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 10px 14px;
        font-family: monospace;
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 24px;
        word-break: break-all;
      }

      .links {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .links a {
        flex: 1;
        text-decoration: none;
        padding: 12px;
        border-radius: 999px;
        font-weight: 700;
        font-family: "Poppins", sans-serif;
        font-size: 13px;
        transition: opacity 0.15s ease;
      }

      .links a:hover {
        opacity: 0.85;
      }

      .links a.primary {
        background: linear-gradient(90deg, var(--coral), #ff9d7a);
        color: #1a1a1a;
      }

      .links a.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .footer-note {
        margin-top: 20px;
        font-size: 11px;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Nexus</h1>
      <p class="subtitle">소셜 3D 월드 · Colyseus 실시간 서버</p>

      <div id="statusPill" class="status-pill">
        <span class="dot"></span>
        <span id="statusText">상태 확인 중…</span>
      </div>

      <div class="stats">
        <div class="stat-box">
          <div class="stat-value" id="roomCount">–</div>
          <div class="stat-label">활성 룸</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="playerCount">–</div>
          <div class="stat-label">접속 인원</div>
        </div>
      </div>

      <div class="endpoint" id="wsEndpoint">ws://…</div>

      <div class="links">
        <a class="primary" href="/monitor">룸 모니터 보기</a>
        <a class="secondary" href="https://github.com" target="_blank" rel="noreferrer">문서</a>
      </div>

      <p class="footer-note">이 페이지는 서버 상태 확인용입니다. 게임 클라이언트는 별도로 실행하세요 (client/).</p>
    </div>

    <script>
      const wsScheme = location.protocol === "https:" ? "wss" : "ws";
      document.getElementById("wsEndpoint").textContent = `${wsScheme}://${location.host}`;

      async function refreshStatus() {
        const pill = document.getElementById("statusPill");
        const statusText = document.getElementById("statusText");
        try {
          const res = await fetch("/api/status");
          if (!res.ok) throw new Error("bad response");
          const data = await res.json();

          pill.classList.remove("offline");
          statusText.textContent = "정상 작동 중";
          document.getElementById("roomCount").textContent = data.rooms ?? 0;
          document.getElementById("playerCount").textContent = data.players ?? 0;
        } catch (err) {
          pill.classList.add("offline");
          statusText.textContent = "상태 확인 실패";
        }
      }

      refreshStatus();
      setInterval(refreshStatus, 4000);
    </script>
  </body>
</html>
