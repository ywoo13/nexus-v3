<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Manager</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #14131f;
        --surface: rgba(30, 28, 46, 0.72);
        --coral: #ff7a59;
        --mint: #6bcfa6;
        --text: #f5f3ef;
        --text-dim: #b8b4c8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, #241f38 0%, #14131f 60%);
        color: var(--text);
        font-family: "Inter", sans-serif;
        padding: 40px 24px 80px;
      }
      .wrap { max-width: 880px; margin: 0 auto; }
      h1 {
        font-family: "Poppins", sans-serif;
        font-size: 32px;
        margin: 0 0 4px;
        background: linear-gradient(90deg, var(--coral), var(--mint));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle { color: var(--text-dim); margin: 0 0 32px; font-size: 14px; }
      h2 {
        font-family: "Poppins", sans-serif;
        font-size: 18px;
        margin: 40px 0 14px;
      }
      .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .stat-box {
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 18px;
        text-align: center;
      }
      .stat-value {
        font-family: "Poppins", sans-serif;
        font-size: 28px;
        font-weight: 700;
      }
      .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        overflow: hidden;
        font-size: 13px;
      }
      th, td {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      th {
        color: var(--text-dim);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      tr:last-child td { border-bottom: none; }
      .empty { color: var(--text-dim); padding: 20px; text-align: center; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(255, 122, 89, 0.15);
        color: var(--coral);
      }
      .unban-btn {
        background: rgba(107, 207, 166, 0.15);
        color: var(--mint);
        border: 1px solid rgba(107, 207, 166, 0.3);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .unban-btn:hover { background: rgba(107, 207, 166, 0.3); }
      .unban-btn:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Nexus Manager</h1>
      <p class="subtitle">개발자 전용 관리 페이지</p>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-value" id="roomCount">–</div>
          <div class="stat-label">활성 룸</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="playerCount">–</div>
          <div class="stat-label">현재 접속 인원</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="userCount">–</div>
          <div class="stat-label">가입 계정 수</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="banCount">–</div>
          <div class="stat-label">차단된 계정/IP</div>
        </div>
      </div>

      <h2>가입 계정 (구글 로그인)</h2>
      <table>
        <thead>
          <tr>
            <th>닉네임</th>
            <th>이메일</th>
            <th>아바타 프리셋</th>
            <th>가입일</th>
            <th>마지막 로그인</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="5" class="empty">불러오는 중…</td></tr>
        </tbody>
      </table>

      <h2>차단 목록</h2>
      <p class="subtitle" style="margin-bottom: 14px;">
        게임 안에서 관리자가 채팅창에 <code>/ban 닉네임</code>을 입력하면 여기 추가됩니다.
        <code>/kick 닉네임</code>은 즉시 퇴장만 시키고 차단 목록에는 남지 않습니다.
      </p>
      <table>
        <thead>
          <tr>
            <th>유형</th>
            <th>값</th>
            <th>사유</th>
            <th>차단일</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bansBody">
          <tr><td colspan="5" class="empty">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>

    <script>
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str ?? "";
        return div.innerHTML;
      }

      async function loadStatus() {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();
          document.getElementById("roomCount").textContent = data.rooms ?? 0;
          document.getElementById("playerCount").textContent = data.players ?? 0;
        } catch (err) {
          console.warn("상태 조회 실패:", err);
        }
      }

      async function loadUsers() {
        const tbody = document.getElementById("usersBody");
        try {
          const res = await fetch("/manager/api/users");
          if (!res.ok) throw new Error("요청 실패");
          const data = await res.json();

          document.getElementById("userCount").textContent = data.users.length;

          if (data.users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">아직 가입한 계정이 없습니다.</td></tr>';
            return;
          }

          tbody.innerHTML = data.users
            .map((u) => {
              const created = u.created_at ? new Date(u.created_at).toLocaleDateString("ko-KR") : "-";
              const lastLogin = u.last_login_at
                ? new Date(u.last_login_at).toLocaleString("ko-KR")
                : "-";
              const preset = u.avatar_preset || "classic";
              return `<tr>
                <td>${escapeHtml(u.name || "(닉네임 없음)")}</td>
                <td>${escapeHtml(u.email)}</td>
                <td>${escapeHtml(preset)}</td>
                <td>${created}</td>
                <td>${lastLogin}</td>
              </tr>`;
            })
            .join("");
        } catch (err) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">불러오지 못했습니다.</td></tr>';
        }
      }

      async function loadBans() {
        const tbody = document.getElementById("bansBody");
        try {
          const res = await fetch("/manager/api/bans");
          if (!res.ok) throw new Error("요청 실패");
          const data = await res.json();

          document.getElementById("banCount").textContent = data.bans.length;

          if (data.bans.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">차단된 계정/IP가 없습니다.</td></tr>';
            return;
          }

          tbody.innerHTML = data.bans
            .map((b) => {
              const typeLabel = b.target_type === "google_id" ? "계정" : "IP";
              const bannedAt = b.banned_at ? new Date(b.banned_at).toLocaleString("ko-KR") : "-";
              return `<tr>
                <td><span class="badge">${escapeHtml(typeLabel)}</span></td>
                <td>${escapeHtml(b.target_value)}</td>
                <td>${escapeHtml(b.reason || "-")}</td>
                <td>${bannedAt}</td>
                <td><button class="unban-btn" data-id="${b.id}">차단 해제</button></td>
              </tr>`;
            })
            .join("");

          tbody.querySelectorAll(".unban-btn").forEach((btn) => {
            btn.addEventListener("click", () => handleUnban(btn));
          });
        } catch (err) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">불러오지 못했습니다.</td></tr>';
        }
      }

      async function handleUnban(btn) {
        const id = btn.dataset.id;
        btn.disabled = true;
        btn.textContent = "해제 중…";
        try {
          const res = await fetch(`/manager/api/bans/${id}`, { method: "DELETE" });
          if (!res.ok) throw new Error("요청 실패");
          loadBans();
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "차단 해제";
          alert("차단 해제에 실패했습니다.");
        }
      }

      loadStatus();
      loadUsers();
      loadBans();
      setInterval(loadStatus, 5000);
    </script>
  </body>
</html>
