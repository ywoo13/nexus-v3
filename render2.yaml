# Render Blueprint — 이 파일을 저장소 루트에 두면 Render 대시보드에서
# "New > Blueprint"로 서버(Web Service)와 클라이언트(Static Site)를 한 번에 만들 수 있습니다.
# 문서: https://render.com/docs/blueprint-spec
#
# GOOGLE_CLIENT_ID / VITE_GOOGLE_CLIENT_ID는 비밀값이 아니라(공개 OAuth 클라이언트 ID) 미리 채워뒀습니다.
# sync: false 로 표시된 값들(MANAGER_PASSWORD, DATABASE_URL, ADMIN_EMAILS 등)은 진짜 비밀값이라
# Blueprint 생성 화면에서 직접 입력해야 합니다 (이 파일에는 저장되지 않음).
#
# DATABASE_URL: Render 자체 무료 Postgres는 생성 30일 후 만료되어 이 프로젝트엔 안 맞습니다.
# Neon(neon.tech) 또는 Supabase(supabase.com)의 만료 없는 무료 Postgres를 추천합니다.

services:
  # ── 서버 (Colyseus + Express) ──────────────────────────────
  - type: web
    name: nexus-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: GOOGLE_CLIENT_ID
        value: 870392911216-3rs60tf7fjqmk53fs3o18qr78lal8c9d.apps.googleusercontent.com
      - key: NAVER_CLIENT_ID
        sync: false # 네이버 개발자센터(developers.naver.com/apps)에서 발급받은 값 — 선택 사항, 안 채우면 네이버 로그인 버튼이 에러를 반환합니다
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_REDIRECT_URI
        sync: false # 예: https://nexus-server.onrender.com/api/auth/naver/callback — 네이버 앱 설정의 Callback URL과 정확히 일치해야 함
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render가 안전한 랜덤 값을 자동 생성
      - key: DATABASE_URL
        sync: false # Neon/Supabase 등에서 발급받은 Postgres 연결 문자열
      - key: MANAGER_USER
        value: admin
      - key: MANAGER_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false # 클라이언트 배포 후 나온 주소를 여기 입력 (예: https://nexus-client.onrender.com)

  # ── 클라이언트 (Vite 정적 빌드) ─────────────────────────────
  - type: web
    name: nexus-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false # 서버 배포 후 나온 주소를 wss://로 입력 (예: wss://nexus-server.onrender.com)
      - key: VITE_GOOGLE_CLIENT_ID
        value: 870392911216-3rs60tf7fjqmk53fs3o18qr78lal8c9d.apps.googleusercontent.com
